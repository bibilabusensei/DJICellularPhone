name: Build unsigned IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project DJICellularPhone.xcodeproj -scheme DJICellularPhone -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DJICellularPhone.app Payload/
          zip -qr DJICellularPhone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DJICellularPhone-unsigned-ipa
          path: DJICellularPhone-unsigned.ipa
