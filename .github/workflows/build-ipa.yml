name: Build unsigned IPA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          python3 --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Validate sanitized hardware snapshot
        run: python3 scripts/verify-ipa.py --snapshot Resources/IG831T-USB-Snapshot.json
      - name: Generate project
        run: xcodegen generate
      - name: Build universal iPhone and iPad device app
        run: |
          set -euo pipefail
          mkdir -p dist
          xcodebuild -project DJICellularPhone.xcodeproj -scheme DJICellularPhone \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee dist/device-build.log
      - name: Build iOS Simulator app
        run: |
          set -euo pipefail
          xcodebuild -project DJICellularPhone.xcodeproj -scheme DJICellularPhone \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee dist/simulator-build.log
      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          app='build/device/Build/Products/Release-iphoneos/DJICellularPhone.app'
          test -d "$app"
          mkdir -p dist/staging/Payload
          cp -R "$app" dist/staging/Payload/
          (cd dist/staging && zip -qr ../DJICellularPhone-unsigned.ipa Payload)
          python3 scripts/verify-ipa.py dist/DJICellularPhone-unsigned.ipa \
            --commit "$GITHUB_SHA" --manifest dist/build-manifest.json
          (cd dist && shasum -a 256 DJICellularPhone-unsigned.ipa > SHA256SUMS.txt)
          {
            echo '### Unsigned research build'
            echo "Commit: $GITHUB_SHA"
            echo 'Device arm64 and iOS Simulator builds completed. IPA includes iPhone/iPad device families and sanitized historical evidence.'
            echo 'Requires separate signing/provisioning. No real USB transport, cellular call, cellular Internet, or DriverKit entitlement is provided.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: DJICellularPhone-unsigned-ipa
          path: |
            dist/DJICellularPhone-unsigned.ipa
            dist/build-manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DJICellularPhone-build-logs
          path: dist/*-build.log
          if-no-files-found: ignore
          retention-days: 14
  publish-research-ipa:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: DJICellularPhone-unsigned-ipa
          path: dist
      - name: Verify checksum and publish unsigned research IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SHA256SUMS.txt
          test -s DJICellularPhone-unsigned.ipa
          test -s build-manifest.json
          gh release create "ios-research-${GITHUB_RUN_NUMBER}" \
            DJICellularPhone-unsigned.ipa build-manifest.json SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "iPhone/iPad unsigned research IPA - build ${GITHUB_RUN_NUMBER}" \
            --notes 'Unsigned iPhone/iPad research UI only. Requires your own valid signing and provisioning. No live USB modem transport, external SIM Internet, cellular calls or DriverKit entitlement. Re-signing does not grant those capabilities. See build-manifest.json and SHA256SUMS.txt for the exact commit and package.'
