name: Publish verified Android experimental APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-android-experimental-v0.1.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: '43922470448'
      SOURCE_SHA: 'ef94d3da22c2bc0b4e29961b5d117f60328016e8'
      APK_SHA256: '45132d25cf829614e118cdeffc97e592b3251f95a2d911db282a0eb8c359ddfb'
      RELEASE_TAG: android-experimental-v0.1.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact successful source run and prevent overwriting releases
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > source-run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('source-run.json'))
          assert run['head_sha'] == os.environ['SOURCE_SHA']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['name'] == 'Build Android compatibility APK'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          PY
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its APK or signing identity.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: DJICellularAndroid-debug-apk
          path: dist/android-release
          github-token: ${{ github.token }}
          run-id: '43922470448'
          digest-mismatch: error
      - name: Verify unchanged APK bytes and source capability manifest
        run: |
          set -euo pipefail
          cd dist/android-release
          printf '%s  DJICellularAndroid-debug.apk\n' "$APK_SHA256" | sha256sum --check --strict
          python3 - <<'PY'
          import json, os
          manifest = json.load(open('build-manifest.json'))
          assert manifest['commit'] == os.environ['SOURCE_SHA']
          assert manifest['sha256'] == os.environ['APK_SHA256']
          assert manifest['version'] == '0.1.1' and manifest['versionCode'] == 2
          assert manifest['hardwareTestsPerformed'] is False
          assert manifest['capabilities']['androidHardwareValidated'] is False
          assert manifest['capabilities']['twoWayCallAudioImplemented'] is False
          assert manifest['capabilities']['userspaceModemDataDriverImplemented'] is False
          assert manifest['capabilities']['systemCellularNetworkIntegrationImplemented'] is False
          PY
          cd ../..
          python3 android/verify-apk.py dist/android-release/DJICellularAndroid-debug.apk --commit "$SOURCE_SHA" --manifest dist/android-release/release-verified.json --badging dist/android-release/apk-badging.txt
      - name: Upload exact verified assets as draft then publish experimental release
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/android-release/DJICellularAndroid-debug.apk \
            dist/android-release/build-manifest.json \
            dist/android-release/SHA256SUMS.txt \
            --target "$SOURCE_SHA" --draft --prerelease --latest=false \
            --title 'Android v0.1.1 USB 识别与状态修复（实验版）' \
            --notes-file docs/Android-Release-v0.1.1.md
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-draft.json
          python3 - <<'PY'
          import json
          release = json.load(open('release-draft.json'))
          assert release['isDraft'] is True
          assets = {asset['name']: asset for asset in release['assets']}
          assert set(assets) == {'DJICellularAndroid-debug.apk', 'build-manifest.json', 'SHA256SUMS.txt'}
          assert all(asset['size'] > 0 for asset in assets.values())
          PY
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          {
            echo '### Public Android experimental release'
            echo "Tag: $RELEASE_TAG"
            echo "Original compiled source: $SOURCE_SHA"
            echo "Unchanged APK SHA-256: $APK_SHA256"
            echo 'Existing debug-signed APK promoted without rebuilding. No new hardware, call audio or modem data capability is claimed.'
          } >> "$GITHUB_STEP_SUMMARY"
