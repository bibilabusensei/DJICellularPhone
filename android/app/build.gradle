plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bibilabusensei.djicellular.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bibilabusensei.djicellular.android'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
